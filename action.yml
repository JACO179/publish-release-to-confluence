name: Release Notes to Confluence Publisher
author: Gershon Alvais
description: Confluence Release BOT. This action will create a release page in confluence with the release notes.
branding:
  icon: "book"
  color: "blue"

inputs:
  # Confluence configs
  spaceId:
    description: Confluence space id. This is the space where the release page will be created.
    required: true
    type: string
  status:
    required: true
    type: string
  title:
    description: Title of the page.  Release tag.
    required: false
    type: string
  parentId:
    description: Parent page id. The release page will be created under this page.
    required: false
    type: string
  ConfluenceBaseUrl:
    description: Confluence base url
    required: true
    type: string
  ConfluenceSpaceKey:
    description: Confluence space key
    type: string
  # Release notes
  tag:
    required: false
    type: string
  confluence_email:
    description: 'Confluence Email'
    required: true
    type: string
  confluence_api_token:
    description: 'Confluence API Token'
    required: true
    type: string
  appName:
    Description: Name of the app. This will be used in the release notes.
    required: false
    type: string
  repoOwner:
    Description: Owner of the repository. This will be used to fetch the release notes.
    required: true
    type: string
  repoName:
    Description: Name of the repository. This will be used to fetch the release notes.
    required: true
    type: string
  # Release assets
  attachAssets:
    description: >-
      Attach the release's built artifacts to the page as well as its notes.
      Lets people who have no access to the repository — or no GitHub account
      at all — download the build from Confluence.
    required: false
    default: "false"
    type: string
  assetPattern:
    description: >-
      Glob selecting which release assets to attach, passed to
      `gh release download --pattern`. Defaults to all of them.
    required: false
    default: "*"
    type: string
  githubToken:
    description: >-
      Token used to download the release assets and read the documents. Required
      when attachAssets is true or docsParentId is set, and it must be able to
      read the repository — for a private one the workflow's own github.token is
      the usual answer. (Written without expression braces deliberately: GitHub
      evaluates them even inside a description, where no context exists yet, and
      the whole action fails to load.)
    required: false
    default: ""
    type: string
  restrictUpdates:
    description: >-
      Restrict editing of the created release page to the account doing the
      publishing. Reading is left inherited from the space, so the page stays
      visible to everyone who can see the space — only editing is closed, so a
      published record of what shipped cannot be altered afterwards.
    required: false
    default: "false"
    type: string
  # Checksums shown as text
  checksumFile:
    description: >-
      A checksum file among the release assets whose contents are shown as text
      on the page, so a reader sees the expected hash beside the download rather
      than having to fetch a second file to learn it. Empty disables this.
    required: false
    default: "SHA256SUMS"
    type: string
  publishReleaseNotes:
    description: >-
      Create the release page. Set false to publish documentation only, for a
      repository that has no releases — the release-notes steps are skipped
      entirely and no tag is needed.
    required: false
    default: "true"
    type: string
  ref:
    description: >-
      Git ref the documents are read from. Defaults to `tag`; set it to a branch
      when publishing documentation without a release.
    required: false
    default: ""
    type: string
  # Documentation mirroring
  docsParentId:
    description: >-
      Parent page under which the repository's Markdown documents are published,
      one child page per file, named after the file. Left empty, no documentation
      is published.

      Each child page's body is replaced on every release, so those pages must
      exist only for this. The parent itself is never written to, so it is free
      to carry an index or anything else by hand.
    required: false
    default: ""
    type: string
  docsPaths:
    description: >-
      Comma-separated globs selecting which Markdown files to publish, e.g.
      "README.md,docs/*.md". A `*` does not cross a directory separator, so
      docs/*.md takes docs/frontend.md and leaves docs/agents/domain.md alone;
      use docs/**/*.md to reach into subdirectories.
    required: false
    default: "README.md"
    type: string
  docsTitlePrefix:
    description: >-
      Prefix added to every page title. Confluence titles are unique per space,
      so two repositories both publishing a README cannot coexist without one —
      "ansible/" gives ansible/README beside another project's README.
    required: false
    default: ""
    type: string
  docsTitleStrip:
    description: >-
      Prefix removed from a document's path before it becomes a page title.
      Titles are the path without the .md extension, so a repository holding
      playbooks/deploy-certs/README.md gets a page called
      "playbooks/deploy-certs/README" unless "playbooks/" is stripped here.
    required: false
    default: ""
    type: string
  archiveRemoved:
    description: >-
      Archive the page of a document that is no longer there. Publishing labels
      every page it writes with the repository it came from, and with this set,
      a labelled page under docsParentId whose document no longer matches
      docsPaths at the published ref is archived — not deleted, and never a page
      this action did not publish. Off by default, because a mirror that removes
      pages should be asked for.
    required: false
    default: "false"
    type: string
  fullWidth:
    description: >-
      Give every published document page the full-width appearance instead of
      Confluence's default fixed-width column. Set as page properties
      (content-appearance-published and -draft) after each page is written,
      so it survives republishing. Off by default: existing callers keep the
      appearance they have.
    required: false
    default: "false"
    type: string

runs:
  using: "composite"
  steps:
    - name: Get Release
      id: get-release
      if: inputs.publishReleaseNotes == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const tag = '${{ inputs.tag }}';
          const release = await github.rest.repos.getReleaseByTag({
            owner: '${{ inputs.repoOwner }}',
            repo: '${{ inputs.repoName }}',
            tag: tag
          });
          if (!release || !release.data.body) {
              console.error('Invalid release');
              return;
          }
          console.log(release.data.body);
          return {
              body: release.data.body,
              url: `https://github.com/${{ inputs.repoOwner }}/${{ inputs.repoName }}/releases/tag/${tag}`
          };

    - name: Post Release Notes to Confluence
      id: post_to_confluence
      if: inputs.publishReleaseNotes == 'true'
      shell: bash
      env:
        # Raw JSON, parsed in the script below. fromJSON() in an env
        # expression is evaluated even when the step is skipped, and on a
        # docs-only run the release output is empty, which printed a
        # template error into every such run.
        RELEASE_JSON: ${{ steps.get-release.outputs.result }}
        CONFLUENCE_BASE_URL: ${{ inputs.ConfluenceBaseUrl }}
        CONFLUENCE_EMAIL: ${{ inputs.confluence_email }}
        CONFLUENCE_API_TOKEN: ${{ inputs.confluence_api_token }}
      run: |
        RELEASE_NOTES=$(jq -r '.body // ""' <<< "${RELEASE_JSON}")
        RELEASE_URL=$(jq -r '.url // ""' <<< "${RELEASE_JSON}")

        # Add additional line before the content
        RELEASE_NOTES="✅ New *${{ inputs.appName }}* Release [${{ inputs.tag }}](${RELEASE_URL}) $(date)\n\n${RELEASE_NOTES}"

        # Remove '##' from RELEASE_NOTES
        RELEASE_NOTES=$(echo -e "${RELEASE_NOTES}" | sed 's/## //g')

        # Remove extra HTML
        RELEASE_NOTES=$(echo -e "${RELEASE_NOTES}" | sed -r 's/<[^>]*>//g')

        # Replace markdown links with confluence links
        RELEASE_NOTES=$(echo -e "${RELEASE_NOTES}" | sed -r 's/\[([^]]+)\]\(([^)]+)\)/[\1|\2]/g')

        # Replace @username with a link to the user's GitHub profile
        RELEASE_NOTES=$(echo -e "${RELEASE_NOTES}" | sed -r 's/@([^ ]+)/[@\1|https:\/\/github.com\/\1]/g')

        # Replace '\n' with '<br/>'
        RELEASE_NOTES=$(echo -e "${RELEASE_NOTES}" | sed 's/\\n/<br\/>/g')

        # An attachment uploaded through the API is on the page but not in it:
        # Confluence shows attachments only where something asks for them, so
        # without this the downloads exist and nobody can see them. The macro
        # lists whatever is attached at view time, which is why it can be added
        # here, before the files themselves have been uploaded.
        # Newlines via $'\n' rather than a literal line break: the surrounding
        # YAML block scalar strips indentation, and wiki markup needs "h2." at
        # the start of its line, so an indented continuation would not render.
        if [ "${{ inputs.attachAssets }}" == "true" ]; then
          RELEASE_NOTES="${RELEASE_NOTES}"$'\n'"h2. Downloads"$'\n'"{attachments:preview=false|upload=false|old=false}"
        fi

        # Prepare the payload
        payload=$(jq -n \
        --arg spaceId "${{ inputs.spaceId }}" \
        --arg status "${{ inputs.status }}" \
        --arg title "Release: ${{ inputs.tag }}" \
        --arg parentId "${{ inputs.parentId }}" \
        --arg value "$RELEASE_NOTES" \
        '{
            "spaceId": $spaceId,
            "status": $status,
            "title": $title,
            "parentId": $parentId,
            "body": {
            "representation": "wiki",
            "value": $value
            }
        }'
        )

        echo "Payload: $payload"
        # Credentials go through the environment, not the command line: argv is
        # readable by any other process on the runner.
        # The body goes as a file: a page of any size is one argv string
        # otherwise, and Linux caps a single argument at 128 KB.
        printf '%s' "$payload" > /tmp/payload.json
        response=$(curl --request POST \
            --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages" \
            --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data @/tmp/payload.json)
        echo "Response: $response"
        pageId=$(echo "$response" | jq -r '.id')

        # Confluence rejects a duplicate title within a space, so a second run
        # for the same tag cannot create the page again. Failing there would
        # make a re-run impossible exactly when it is most wanted: after a run
        # that created the page and then failed part-way through attaching to
        # it. Adopt the existing page and refresh its body instead.
        if [ "$pageId" == "null" ] \
           && echo "$response" | grep -q "same TITLE in this space"; then
          title="Release: ${{ inputs.tag }}"
          echo "A page titled '${title}' already exists — updating it instead."
          encoded=$(printf '%s' "$title" | jq -sRr @uri)
          pageId=$(curl --silent --show-error \
              --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/spaces/${{ inputs.spaceId }}/pages?title=${encoded}" \
              --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              --header 'Accept: application/json' \
            | jq -r '.results[0].id // "null"')
          if [ "$pageId" == "null" ]; then
            echo "The title is taken but the page could not be found — it may live outside this space." >&2
            exit 1
          fi
          current=$(curl --silent --show-error \
              --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${pageId}" \
              --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              --header 'Accept: application/json' | jq -r '.version.number')
          update=$(jq -n \
            --arg id "$pageId" --arg title "$title" --arg value "$RELEASE_NOTES" \
            --argjson version "$((current + 1))" \
            '{id: $id, status: "current", title: $title,
              body: {representation: "wiki", value: $value},
              version: {number: $version, message: "Re-published release notes"}}')
          code=$(curl --silent --show-error --output /tmp/page-update.json \
              --write-out '%{http_code}' --request PUT \
              --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${pageId}" \
              --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --data "$update")
          if [ "$code" != "200" ]; then
            echo "Failed to update the existing page: HTTP ${code}" >&2
            cat /tmp/page-update.json >&2
            exit 1
          fi
        fi

        echo "Page ID: $pageId"
        if [ "$pageId" == "null" ]; then
          echo "Failed to create page"
          exit 1
        fi
        echo "pageId=$pageId" >> $GITHUB_ENV
        echo "pageId=$pageId" >> $GITHUB_OUTPUT

        # A published release page is a record of what shipped. Left editable by
        # the whole space it can be changed by anyone, silently and after the
        # fact, and the next publish of that tag would not restore it.
        #
        # Only the update operation is restricted; read is left inherited, so
        # the page stays visible to everyone the space is visible to — which is
        # the entire reason it is published there.
        if [ "${{ inputs.restrictUpdates }}" == "true" ]; then
          accountId=$(curl --silent --show-error --fail \
              --url "${CONFLUENCE_BASE_URL}/wiki/rest/api/user/current" \
              --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              --header 'Accept: application/json' | jq -r '.accountId')
          if [ -z "$accountId" ] || [ "$accountId" == "null" ]; then
            echo "Could not determine the publishing account for restrictions." >&2
            exit 1
          fi
          # PUT replaces the restrictions wholesale, so republishing a tag
          # re-asserts them rather than stacking duplicates.
          restrictions=$(jq -n --arg id "$accountId" \
            '[{operation: "update",
               restrictions: {user: [{type: "known", accountId: $id}], group: []}}]')
          code=$(curl --silent --show-error --output /tmp/restrict-response.json \
              --write-out '%{http_code}' --request PUT \
              --url "${CONFLUENCE_BASE_URL}/wiki/rest/api/content/${pageId}/restriction" \
              --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --data "$restrictions")
          if [ "$code" != "200" ]; then
            echo "Failed to restrict editing: HTTP ${code}" >&2
            cat /tmp/restrict-response.json >&2
            exit 1
          fi
          echo "Editing restricted to the publishing account; reading unchanged."
        fi

    # Release notes tell people what changed; the assets let them actually have
    # it. For a private repository this is the whole point — a colleague with no
    # GitHub account can still download the build from the Confluence page.
    - name: Attach release assets to the page
      if: inputs.attachAssets == 'true'
      shell: bash
      env:
        PAGE_ID: ${{ steps.post_to_confluence.outputs.pageId }}
        TAG: ${{ inputs.tag }}
        REPO: ${{ inputs.repoOwner }}/${{ inputs.repoName }}
        PATTERN: ${{ inputs.assetPattern }}
        CHECKSUM_FILE: ${{ inputs.checksumFile }}
        GH_TOKEN: ${{ inputs.githubToken }}
        CONFLUENCE_BASE_URL: ${{ inputs.ConfluenceBaseUrl }}
        CONFLUENCE_EMAIL: ${{ inputs.confluence_email }}
        CONFLUENCE_API_TOKEN: ${{ inputs.confluence_api_token }}
      run: |
        if [ -z "${GH_TOKEN}" ]; then
          echo "attachAssets is true but githubToken is empty — pass \${{ github.token }}." >&2
          exit 1
        fi

        workdir="$(mktemp -d)"
        gh release download "${TAG}" --repo "${REPO}" --pattern "${PATTERN}" --dir "${workdir}"

        shopt -s nullglob
        files=("${workdir}"/*)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No release assets matched pattern '${PATTERN}' on ${TAG}." >&2
          exit 1
        fi

        # Attachment upload is still v1, even on Cloud where pages are v2, and
        # X-Atlassian-Token: no-check is mandatory or the POST is refused as CSRF.
        attach_url="${CONFLUENCE_BASE_URL}/wiki/rest/api/content/${PAGE_ID}/child/attachment"
        failed=0
        for f in "${files[@]}"; do
          name="$(basename "$f")"

          # Adding an attachment whose name is already on the page is refused —
          # "Cannot add a new attachment with same file name as an existing
          # attachment". Replacing it is a different endpoint, so ask first.
          existing=$(curl --silent --show-error --get \
              --url "${attach_url}" \
              --data-urlencode "filename=${name}" \
              --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              --header 'Accept: application/json' \
            | jq -r '.results[0].id // ""')

          if [ -n "$existing" ]; then
            target="${attach_url}/${existing}/data"
            echo "Replacing ${name} ($(du -h "$f" | cut -f1)) …"
          else
            target="${attach_url}"
            echo "Attaching ${name} ($(du -h "$f" | cut -f1)) …"
          fi

          code=$(curl --silent --show-error --output /tmp/attach-response.json \
              --write-out '%{http_code}' \
              --request POST \
              --url "${target}" \
              --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              --header 'X-Atlassian-Token: no-check' \
              --form "file=@${f}" \
              --form 'minorEdit=true')
          if [ "$code" != "200" ]; then
            echo "  failed: HTTP ${code}" >&2
            # Confluence reports the size cap here; a large single-file build is
            # the likeliest reason an upload is rejected.
            jq -r '.message // .' /tmp/attach-response.json >&2 || cat /tmp/attach-response.json >&2
            failed=1
          else
            echo "  ok"
          fi
        done

        # Checksums are worth reading, not just downloading: someone verifying a
        # file needs the expected hash visible beside the link, without fetching
        # a second file to find out what the first one should hash to.
        checksums=""
        if [ -n "${CHECKSUM_FILE}" ] && [ -f "${workdir}/${CHECKSUM_FILE}" ]; then
          checksums=$(cat "${workdir}/${CHECKSUM_FILE}")
        fi

        rm -rf "${workdir}"
        if [ "$failed" -ne 0 ]; then
          echo "One or more attachments failed to upload." >&2
          exit 1
        fi

        if [ -n "$checksums" ]; then
          page=$(curl --silent --show-error --fail \
              --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${PAGE_ID}?body-format=storage" \
              --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              --header 'Accept: application/json')
          printf '%s' "$page" | jq -r '.body.storage.value' > /tmp/page-body.html
          printf '%s' "$checksums" > /tmp/checksums.txt

          # Passed by path, never on stdin: `python3 -` reads its program from
          # stdin, so the heredoc owns it.
          python3 - /tmp/page-body.html /tmp/checksums.txt "${CHECKSUM_FILE}" > /tmp/page-body-new.html <<'PYTHON'
        import html, re, sys

        body = open(sys.argv[1], encoding="utf-8").read()
        sums = open(sys.argv[2], encoding="utf-8").read().strip()
        name = sys.argv[3]

        # Bounded by markers so republishing replaces the block instead of
        # appending another copy of it.
        START = "<!-- checksums:start -->"
        END = "<!-- checksums:end -->"
        body = re.sub(re.escape(START) + ".*?" + re.escape(END), "", body, flags=re.S)

        block = (
            '%s<h2>Checksums</h2>'
            '<p>SHA-256, as published in <code>%s</code>.</p>'
            '<pre>%s</pre>%s'
            % (START, html.escape(name), html.escape(sums), END)
        )
        sys.stdout.write(body.rstrip() + block)
        PYTHON

          version=$(printf '%s' "$page" | jq -r '.version.number')
          title=$(printf '%s' "$page" | jq -r '.title')
          payload=$(jq -n --arg id "${PAGE_ID}" --arg title "$title" \
            --rawfile value /tmp/page-body-new.html --argjson version "$((version + 1))" \
            '{id: $id, status: "current", title: $title,
              body: {representation: "storage", value: $value},
              version: {number: $version, message: "Published checksums"}}')
          # The body goes as a file: a page of any size is one argv string
          # otherwise, and Linux caps a single argument at 128 KB.
          printf '%s' "$payload" > /tmp/payload.json
          code=$(curl --silent --show-error --output /tmp/sums-response.json \
              --write-out '%{http_code}' --request PUT \
              --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${PAGE_ID}" \
              --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --data @/tmp/payload.json)
          if [ "$code" != "200" ]; then
            echo "Failed to publish the checksums: HTTP ${code}" >&2
            cat /tmp/sums-response.json >&2
            exit 1
          fi
          echo "Checksums published."
        fi

    # Mirrors the repository README onto a page, so the documentation a reader
    # sees in Confluence is the documentation that shipped with the release.
    # Mirrors the repository's Markdown documents onto Confluence, one child
    # page per file under a parent this action never writes to. A colleague with
    # no repository access gets the documentation that shipped with the release,
    # not whatever the default branch has drifted to since.
    - name: Publish documentation to Confluence
      if: inputs.docsParentId != ''
      shell: bash
      env:
        DOCS_PARENT_ID: ${{ inputs.docsParentId }}
        DOCS_PATHS: ${{ inputs.docsPaths }}
        DOCS_TITLE_STRIP: ${{ inputs.docsTitleStrip }}
        DOCS_TITLE_PREFIX: ${{ inputs.docsTitlePrefix }}
        ARCHIVE_REMOVED: ${{ inputs.archiveRemoved }}
        FULL_WIDTH: ${{ inputs.fullWidth }}
        SPACE_ID: ${{ inputs.spaceId }}
        TAG: ${{ inputs.tag }}
        REF: ${{ inputs.ref }}
        REPO: ${{ inputs.repoOwner }}/${{ inputs.repoName }}
        GH_TOKEN: ${{ inputs.githubToken }}
        RESTRICT: ${{ inputs.restrictUpdates }}
        CONFLUENCE_BASE_URL: ${{ inputs.ConfluenceBaseUrl }}
        CONFLUENCE_EMAIL: ${{ inputs.confluence_email }}
        CONFLUENCE_API_TOKEN: ${{ inputs.confluence_api_token }}
      run: |
        if [ -z "${GH_TOKEN}" ]; then
          echo "docsParentId is set but githubToken is empty — pass github.token." >&2
          exit 1
        fi

        # A repository without releases publishes from a branch; one with them
        # publishes from the tag, so the documents match the build beside them.
        SOURCE_REF="${REF:-${TAG}}"
        if [ -z "${SOURCE_REF}" ]; then
          echo "Neither ref nor tag was given — nothing to read the documents from." >&2
          exit 1
        fi
        echo "Reading documents at ${SOURCE_REF}"

        # The sanitizer is written to a file rather than piped in: `python3 -`
        # reads its program from stdin, so a heredoc there leaves sys.stdin
        # empty — which once published a page containing only its banner.
        cat > /tmp/to_storage.py <<'PYTHON'
        import html, re, sys
        from html.parser import HTMLParser
        from urllib.parse import urljoin

        # Confluence storage format accepts a small XHTML subset. Anything else
        # is either dropped or unwrapped, keeping its text.
        KEEP = {"p", "br", "hr", "h1", "h2", "h3", "h4", "h5", "h6",
                "ul", "ol", "li", "strong", "em", "b", "i", "code", "pre",
                "blockquote", "table", "thead", "tbody", "tr", "th", "td",
                "a", "del", "sup", "sub"}
        VOID = {"br", "hr"}
        # A remote image goes entirely: status badges are served from endpoints
        # that require repository access, so to the audience these pages exist
        # for they would render as broken. An image committed to the repository
        # is a different thing — it is part of the document, and it is
        # attachable, so it is kept and dealt with below.
        DROP = {"img", "svg", "path", "script", "style", "picture", "source",
                "iframe", "input", "button"}

        class ToStorage(HTMLParser):
            def __init__(self):
                super().__init__(convert_charrefs=True)
                self.out, self.stack, self.dropping = [], [], 0

            def handle_starttag(self, tag, attrs):
                if self.dropping:
                    if tag not in VOID and tag not in ("img", "input", "source", "path"):
                        self.dropping += 1
                    return
                if tag == "img":
                    src = dict(attrs).get("src", "")
                    # Relative to the document, so it names a file in the
                    # repository. Anything with a scheme, or protocol-relative,
                    # lives elsewhere and is dropped as before.
                    if src and not re.match(r"[a-zA-Z][a-zA-Z0-9+.-]*:", src) \
                            and not src.startswith("//"):
                        path = urljoin(DOC_BASE, src).lstrip("/")
                        if path not in IMAGES:
                            IMAGES.append(path)
                        self.out.append("CONFLUENCEIMAGE%dPLACEHOLDER"
                                        % IMAGES.index(path))
                    return
                if tag in DROP:
                    if tag not in ("img", "input", "source", "path"):
                        self.dropping = 1
                    return
                if tag in VOID:
                    self.out.append("<%s/>" % tag)
                    return
                if tag not in KEEP:
                    self.stack.append((tag, False))
                    return
                if tag == "a":
                    href = dict(attrs).get("href", "")
                    # Confluence derives its own heading ids, so an in-page
                    # anchor written for GitHub would land nowhere.
                    if not href or href.startswith("#"):
                        self.stack.append((tag, False))
                        return
                    if not re.match(r"[a-zA-Z][a-zA-Z0-9+.-]*:", href) \
                            and not href.startswith("//"):
                        href = urljoin(BLOB_BASE, href)
                    self.out.append('<a href="%s">' % html.escape(href, quote=True))
                    self.stack.append((tag, True))
                    return
                self.out.append("<%s>" % tag)
                self.stack.append((tag, True))

            def handle_endtag(self, tag):
                if self.dropping:
                    self.dropping -= 1
                    return
                if tag in VOID or tag in DROP:
                    return
                for i in range(len(self.stack) - 1, -1, -1):
                    if self.stack[i][0] == tag:
                        if self.stack[i][1]:
                            self.out.append("</%s>" % tag)
                        del self.stack[i:]
                        return

            def handle_data(self, data):
                if not self.dropping:
                    self.out.append(html.escape(data, quote=False))

        tag, repo, source, doc_path, images_out = sys.argv[1:6]
        BLOB_BASE = "https://github.com/%s/blob/%s/" % (repo, tag)
        # Image sources are relative to the document, not to the repository
        # root: README.md next to docs/media/x.gif writes docs/media/x.gif,
        # while docs/frontend.md writes media/x.gif for the same file.
        DOC_BASE = "/" + doc_path
        IMAGES = []
        rendered = open(source, encoding="utf-8").read()
        if not rendered.strip():
            sys.exit("rendered %s is empty — nothing to publish" % doc_path)

        parser = ToStorage()
        parser.feed(rendered)
        parser.close()
        for name, emitted in reversed(parser.stack):
            if emitted:
                parser.out.append("</%s>" % name)

        body = "".join(parser.out)
        # A paragraph holding exactly [[toc]] becomes Confluence's own table
        # of contents macro. It is the one macro a document can ask for: a
        # hand-written list of #anchors is unwrapped above, because Confluence
        # derives its own heading ids, so a long generated page had no way to
        # be navigated. Headings from level 2 down — level 1 is the title.
        body = body.replace(
            "<p>[[toc]]</p>",
            '<ac:structured-macro ac:name="toc" ac:schema-version="1">'
            '<ac:parameter ac:name="minLevel">2</ac:parameter>'
            "</ac:structured-macro>",
        )
        # GitHub's renderer wraps every image in a link to the file it came
        # from. Resolved against the repository that link is useless here — it
        # needs the repository access these readers do not have — and Confluence
        # will not render an ac:image nested in an anchor at all, showing
        # "Preview unavailable" in its place. The picture is the content; the
        # wrapper goes.
        body = re.sub(r'<a href="[^"]*">(CONFLUENCEIMAGE\d+PLACEHOLDER)</a>',
                      r"\1", body)
        # Dropping a badge image leaves its link wrapper behind as an empty
        # anchor, and a row of badges collapses to a paragraph of line breaks.
        body = re.sub(r'<a href="[^"]*"\s*></a>', "", body)
        body = re.sub(r"(?:<br/>\s*){2,}", "<br/>", body)
        body = re.sub(r"<p>(?:\s|<br/>)*</p>", "", body)
        if not body.strip():
            sys.exit("sanitized %s is empty — refusing to publish a banner alone" % doc_path)

        banner = (
            '<p><strong>Published automatically from %s in %s at %s.</strong> '
            'Edits made here are overwritten by the next release.</p><hr/>'
            % (html.escape(doc_path), html.escape(repo), html.escape(tag))
        )
        # One path per line, in placeholder order, for the attach pass.
        with open(images_out, "w", encoding="utf-8") as fh:
            fh.write("".join(p + "\n" for p in IMAGES))
        sys.stdout.write(banner + body)
        PYTHON

        # Mermaid is rendered by GitHub in the browser, not by its Markdown API,
        # so a fence arrives here as a code block and stays one — which is what
        # a Confluence reader saw: the source of a diagram instead of a diagram.
        # Lift each fence out before rendering, draw it, and put an image back.
        cat > /tmp/mermaid.py <<'PYTHON'
        import os, re, sys

        mode, doc_md, out_md, diag_dir, slug = sys.argv[1:6]

        if mode == "extract":
            src = open(doc_md, encoding="utf-8").read()
            os.makedirs(diag_dir, exist_ok=True)
            found = []

            def take(match):
                n = len(found) + 1
                found.append(match.group(1))
                # A bare token on its own line survives Markdown rendering as a
                # paragraph, which is what the image replaces later.
                return "CONFLUENCEMERMAID%dPLACEHOLDER" % n

            src = re.sub(r"```mermaid\n(.*?)```", take, src, flags=re.S)
            for n, body in enumerate(found, 1):
                with open(os.path.join(diag_dir, "%s-diagram-%d.mmd" % (slug, n)),
                          "w", encoding="utf-8") as fh:
                    fh.write(body)
            open(out_md, "w", encoding="utf-8").write(src)
            print(len(found))

        elif mode == "embed":
            html = open(doc_md, encoding="utf-8").read()
            count = int(sys.argv[6])
            for n in range(1, count + 1):
                name = "%s-diagram-%d.png" % (slug, n)
                # Width is capped because these diagrams are far taller than
                # they are wide; full size would dominate the page.
                image = ('<ac:image ac:align="center" ac:width="900">'
                         '<ri:attachment ri:filename="%s" /></ac:image>' % name)
                token = "CONFLUENCEMERMAID%dPLACEHOLDER" % n
                html = html.replace("<p>%s</p>" % token, image)
                html = html.replace(token, image)
            open(out_md, "w", encoding="utf-8").write(html)
        PYTHON

        # The same substitution for the images the document carried, once they
        # are attachments: one line per placeholder, in order, empty where the
        # file could not be attached.
        cat > /tmp/embed_images.py <<'PYTHON'
        import sys

        src, dest, names_file = sys.argv[1:4]
        html = open(src, encoding="utf-8").read()
        names = open(names_file, encoding="utf-8").read().splitlines()
        for n, name in enumerate(names):
            token = "CONFLUENCEIMAGE%dPLACEHOLDER" % n
            if name:
                image = ('<ac:image ac:align="center">'
                         '<ri:attachment ri:filename="%s" /></ac:image>' % name)
            else:
                # Nothing to point at. The paragraph goes rather than leaving
                # the token itself on the page.
                image = ""
            html = html.replace("<p>%s</p>" % token, image)
            html = html.replace(token, image)
        open(dest, "w", encoding="utf-8").write(html)
        PYTHON

        # Which files to publish. A `*` must not cross a directory separator —
        # docs/*.md means the documents in docs/, not everything beneath it — and
        # patterns anchor at the repository root, so README.md cannot also pick
        # up docs/README.md. fnmatch gives neither, hence the explicit translation.
        gh api "repos/${REPO}/git/trees/${SOURCE_REF}?recursive=1" \
          --jq '.tree[] | select(.type == "blob") | .path' > /tmp/tree.txt

        cat > /tmp/select_docs.py <<'PYTHON'
        import re, sys

        def to_regex(pattern):
            out, i = "", 0
            while i < len(pattern):
                c = pattern[i]
                if pattern.startswith("**/", i):
                    out += "(?:.*/)?"; i += 3
                elif c == "*":
                    out += "[^/]*"; i += 1
                elif c == "?":
                    out += "[^/]"; i += 1
                else:
                    out += re.escape(c); i += 1
            return re.compile("^" + out + "$")

        patterns = [to_regex(p.strip()) for p in sys.argv[1].split(",") if p.strip()]
        seen = []
        for line in open(sys.argv[2], encoding="utf-8").read().splitlines():
            if any(p.match(line) for p in patterns) and line not in seen:
                seen.append(line)
        print("\n".join(seen))
        PYTHON

        python3 /tmp/select_docs.py "${DOCS_PATHS}" /tmp/tree.txt > /tmp/selected.txt

        if [ ! -s /tmp/selected.txt ]; then
          echo "No files in ${SOURCE_REF} matched '${DOCS_PATHS}'." >&2
          exit 1
        fi
        echo "Publishing under page ${DOCS_PARENT_ID}:"
        sed 's/^/  /' /tmp/selected.txt

        # Which pages belong to this repository. Confluence labels take neither
        # uppercase nor a slash, so the name is folded; naming the repository
        # rather than the action lets two repositories share one parent page
        # without either one archiving the other's pages.
        DOCS_LABEL="published-from-$(printf '%s' "${REPO}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-')"
        DOCS_LABEL="${DOCS_LABEL%-}"
        : > /tmp/published.txt

        while IFS= read -r doc; do
          [ -n "$doc" ] || continue
          # The path, not the basename: a repository of playbooks has a
          # README.md in every directory, and they cannot all be called README.
          title="${doc%.md}"
          if [ -n "${DOCS_TITLE_STRIP}" ]; then
            title="${title#${DOCS_TITLE_STRIP}}"
          fi
          title="${DOCS_TITLE_PREFIX}${title}"
          echo "--- ${doc} -> '${title}'"

          gh api "repos/${REPO}/contents/${doc}?ref=${SOURCE_REF}" --jq '.content' \
            | base64 -d > /tmp/doc-raw.md
          rm -rf /tmp/diagrams && mkdir -p /tmp/diagrams
          # A title may hold a path separator now, and it names files on disk
          # and attachments in Confluence — neither of which takes a slash.
          slug=$(printf '%s' "$title" | tr '/' '-')
          diagrams=$(python3 /tmp/mermaid.py extract /tmp/doc-raw.md /tmp/doc.md /tmp/diagrams "$slug")
          [ "$diagrams" -gt 0 ] && echo "  ${diagrams} mermaid diagram(s)"
          jq -n --rawfile text /tmp/doc.md --arg ctx "${REPO}" \
            '{text: $text, mode: "gfm", context: $ctx}' > /tmp/doc-request.json
          gh api --method POST /markdown --input /tmp/doc-request.json > /tmp/doc.html
          python3 /tmp/to_storage.py "${SOURCE_REF}" "${REPO}" /tmp/doc.html "${doc}" \
            /tmp/images.txt > /tmp/doc-storage.html

          encoded=$(printf '%s' "$title" | jq -sRr @uri)
          found=$(curl --silent --show-error \
              --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/spaces/${SPACE_ID}/pages?title=${encoded}" \
              --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              --header 'Accept: application/json')
          pageId=$(printf '%s' "$found" | jq -r '.results[0].id // ""')
          foundParent=$(printf '%s' "$found" | jq -r '.results[0].parentId // ""')
          foundStatus=$(printf '%s' "$found" | jq -r '.results[0].status // ""')

          # A title still resolves to a page after it has been archived, and an
          # archived page reports no parent, so the check below would refuse a
          # returning document for colliding with the page this action itself
          # archived — and blame the wrong thing while doing it.
          if [ -n "$pageId" ] && [ "$foundStatus" == "archived" ]; then
            labels=$(curl --silent --show-error \
                --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${pageId}/labels" \
                --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                --header 'Accept: application/json' | jq -r '.results[]?.name // empty')
            if printf '%s\n' "$labels" | grep -Fxq "${DOCS_LABEL}"; then
              # This page was archived by an earlier run of this action, and the
              # document has come back. Confluence will not let it be revived
              # from here: v2 answers 404 for archived content, v1 answers 403
              # on the update, and there is no unarchive endpoint to call. One
              # click in Confluence does what the API will not.
              echo "  '${title}' was archived by an earlier run, and its document is back." >&2
              echo "  Confluence has no API for reviving it. In Space settings ->" >&2
              echo "  Archived pages, restore page ${pageId} — it returns with its" >&2
              echo "  history — or purge it to publish a fresh page, then run again." >&2
              exit 1
            else
              # Someone else's archived page, which the update below would drag
              # back into the tree under our parent.
              echo "  a page titled '${title}' exists at ${pageId} and is archived," >&2
              echo "  but was not published from ${REPO}. Restore or purge it first." >&2
              exit 1
            fi
          fi

          if [ -n "$pageId" ] && [ "$foundParent" != "${DOCS_PARENT_ID}" ]; then
            # Titles are unique per space, so a generic name like "architecture"
            # can already belong to somebody else. Overwriting that page would be
            # the worst possible outcome, so stop and say so.
            echo "  a page titled '${title}' exists at ${pageId} under parent ${foundParent}," >&2
            echo "  which is not ${DOCS_PARENT_ID}. Rename one of them; refusing to overwrite." >&2
            exit 1
          fi

          if [ -n "$pageId" ]; then
            version=$(curl --silent --show-error \
                --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${pageId}" \
                --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                --header 'Accept: application/json' | jq -r '.version.number')
            payload=$(jq -n --arg id "$pageId" --arg title "$title" \
              --rawfile value /tmp/doc-storage.html --argjson version "$((version + 1))" \
              '{id: $id, status: "current", title: $title,
                body: {representation: "storage", value: $value},
                version: {number: $version, message: "Published from the repository"}}')
            # The body goes as a file: a page of any size is one argv string
            # otherwise, and Linux caps a single argument at 128 KB.
            printf '%s' "$payload" > /tmp/payload.json
            code=$(curl --silent --show-error --output /tmp/doc-response.json \
                --write-out '%{http_code}' --request PUT \
                --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${pageId}" \
                --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                --header 'Accept: application/json' --header 'Content-Type: application/json' \
                --data @/tmp/payload.json)
            action="updated to version $((version + 1))"
          else
            payload=$(jq -n --arg spaceId "${SPACE_ID}" --arg title "$title" \
              --arg parentId "${DOCS_PARENT_ID}" --rawfile value /tmp/doc-storage.html \
              '{spaceId: $spaceId, status: "current", title: $title, parentId: $parentId,
                body: {representation: "storage", value: $value}}')
            # The body goes as a file: a page of any size is one argv string
            # otherwise, and Linux caps a single argument at 128 KB.
            printf '%s' "$payload" > /tmp/payload.json
            code=$(curl --silent --show-error --output /tmp/doc-response.json \
                --write-out '%{http_code}' --request POST \
                --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages" \
                --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                --header 'Accept: application/json' --header 'Content-Type: application/json' \
                --data @/tmp/payload.json)
            pageId=$(jq -r '.id // ""' /tmp/doc-response.json)
            action="created as page ${pageId}"
          fi

          if [ "$code" != "200" ] || [ -z "$pageId" ]; then
            echo "  failed: HTTP ${code}" >&2
            jq -r '.errors[]?.title // .message // .' /tmp/doc-response.json >&2 \
              || cat /tmp/doc-response.json >&2
            exit 1
          fi
          echo "  ${action}"
          printf '%s\n' "$title" >> /tmp/published.txt

          # Full width is a pair of content properties, not a page field. A
          # property that already exists must be PUT with its next version;
          # a missing one is POSTed. Both are idempotent across republishes.
          if [ "${FULL_WIDTH}" == "true" ]; then
            for key in content-appearance-published content-appearance-draft; do
              existing=$(curl --silent --show-error \
                  --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${pageId}/properties?key=${key}" \
                  --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                  --header 'Accept: application/json' \
                  | jq -r '.results[0] // empty | "\(.id) \(.version.number)"')
              if [ -n "$existing" ]; then
                propId=${existing%% *}; pver=${existing##* }
                pcode=$(curl --silent --show-error --output /tmp/doc-prop.json \
                    --write-out '%{http_code}' --request PUT \
                    --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${pageId}/properties/${propId}" \
                    --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                    --header 'Accept: application/json' --header 'Content-Type: application/json' \
                    --data "$(jq -n --arg key "$key" --argjson v "$((pver + 1))" \
                      '{key: $key, value: "full-width", version: {number: $v}}')")
              else
                pcode=$(curl --silent --show-error --output /tmp/doc-prop.json \
                    --write-out '%{http_code}' --request POST \
                    --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${pageId}/properties" \
                    --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                    --header 'Accept: application/json' --header 'Content-Type: application/json' \
                    --data "$(jq -n --arg key "$key" '{key: $key, value: "full-width"}')")
              fi
              if [ "$pcode" != "200" ]; then
                echo "  full width (${key}): HTTP ${pcode}" >&2
                jq -r '.errors[]?.title // .message // .' /tmp/doc-prop.json >&2 \
                  || cat /tmp/doc-prop.json >&2
                exit 1
              fi
            done
            echo "  full width"
          fi

          # The label is what makes a page recognisable as this repository's on
          # a later run. Adding one that is already there is a no-op, so every
          # publish re-stamps rather than checking first. Labelling is v1: v2
          # reads labels but does not write them.
          lcode=$(curl --silent --show-error --output /tmp/doc-label.json \
              --write-out '%{http_code}' --request POST \
              --url "${CONFLUENCE_BASE_URL}/wiki/rest/api/content/${pageId}/label" \
              --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
              --header 'Accept: application/json' --header 'Content-Type: application/json' \
              --data "$(jq -n --arg name "${DOCS_LABEL}" '[{prefix: "global", name: $name}]')")
          if [ "$lcode" != "200" ]; then
            echo "  could not label the page: HTTP ${lcode}" >&2
            cat /tmp/doc-label.json >&2
          fi

          # Images the document carries with it, in the order the sanitiser
          # numbered its placeholders. Each becomes an attachment on the page,
          # because a reader without repository access cannot fetch the file
          # the src pointed at.
          images=0
          : > /tmp/image-names.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            # The attachment is named after the whole path: two documents may
            # each carry a media/diagram.png, and they share one page tree.
            name="$(printf '%s' "${doc%.md}-${path}" | tr '/' '-')"
            if ! gh api "repos/${REPO}/contents/${path}?ref=${SOURCE_REF}" --jq '.content' \
                 2>/dev/null | base64 -d > "/tmp/img-${name}" || [ ! -s "/tmp/img-${name}" ]; then
              # The alt text stays behind in the body, which is the same thing a
              # reader would see if the file were missing on GitHub.
              echo "  no such image in ${SOURCE_REF}: ${path}" >&2
              rm -f "/tmp/img-${name}"
              printf '\n' >> /tmp/image-names.txt
              images=$((images + 1))
              continue
            fi
            att="${CONFLUENCE_BASE_URL}/wiki/rest/api/content/${pageId}/child/attachment"
            existing=$(curl --silent --show-error --get --url "$att" \
                --data-urlencode "filename=${name}" \
                --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                --header 'Accept: application/json' | jq -r '.results[0].id // ""')
            [ -n "$existing" ] && target="${att}/${existing}/data" || target="$att"
            # The attachment takes the name curl sends, not the one it is
            # looked up by, so filename= is what makes the two agree — without
            # it the file lands under the temporary path's name and the
            # ri:attachment written into the page resolves to nothing.
            icode=$(curl --silent --show-error --output /tmp/img-response.json \
                --write-out '%{http_code}' --request POST --url "$target" \
                --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                --header 'X-Atlassian-Token: no-check' \
                --form "file=@/tmp/img-${name};filename=${name}" --form 'minorEdit=true')
            if [ "$icode" != "200" ]; then
              echo "  failed to attach ${path}: HTTP ${icode}" >&2
              cat /tmp/img-response.json >&2
              printf '\n' >> /tmp/image-names.txt
            else
              echo "  attached ${path} as ${name}"
              printf '%s\n' "$name" >> /tmp/image-names.txt
            fi
            images=$((images + 1))
          done < /tmp/images.txt

          if [ "$diagrams" -gt 0 ]; then
            printf '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/pptr.json
            for n in $(seq 1 "$diagrams"); do
              png="/tmp/diagrams/${slug}-diagram-${n}.png"
              npx -y @mermaid-js/mermaid-cli@11 \
                -i "/tmp/diagrams/${slug}-diagram-${n}.mmd" -o "$png" \
                -p /tmp/pptr.json -b white -s 2 >/dev/null 2>&1
              if [ ! -s "$png" ]; then
                echo "  failed to render diagram ${n}" >&2
                exit 1
              fi
              name=$(basename "$png")
              att="${CONFLUENCE_BASE_URL}/wiki/rest/api/content/${pageId}/child/attachment"
              existing=$(curl --silent --show-error --get --url "$att" \
                  --data-urlencode "filename=${name}" \
                  --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                  --header 'Accept: application/json' | jq -r '.results[0].id // ""')
              [ -n "$existing" ] && target="${att}/${existing}/data" || target="$att"
              acode=$(curl --silent --show-error --output /tmp/diag-response.json \
                  --write-out '%{http_code}' --request POST --url "$target" \
                  --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                  --header 'X-Atlassian-Token: no-check' \
                  --form "file=@${png}" --form 'minorEdit=true')
              if [ "$acode" != "200" ]; then
                echo "  failed to attach ${name}: HTTP ${acode}" >&2
                cat /tmp/diag-response.json >&2
                exit 1
              fi
              echo "  drew and attached ${name}"
            done
          fi

          # An image can only be referenced once its attachment exists, so a
          # document carrying either diagrams or images is published a second
          # time with the placeholders replaced.
          if [ "$diagrams" -gt 0 ] || [ "$images" -gt 0 ]; then
            body=/tmp/doc-storage.html
            if [ "$diagrams" -gt 0 ]; then
              python3 /tmp/mermaid.py embed "$body" /tmp/doc-mermaid.html \
                /tmp/diagrams "$slug" "$diagrams"
              body=/tmp/doc-mermaid.html
            fi
            if [ "$images" -gt 0 ]; then
              python3 /tmp/embed_images.py "$body" /tmp/doc-final.html /tmp/image-names.txt
            else
              cp "$body" /tmp/doc-final.html
            fi
            version=$(curl --silent --show-error \
                --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${pageId}" \
                --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                --header 'Accept: application/json' | jq -r '.version.number')
            payload=$(jq -n --arg id "$pageId" --arg title "$title" \
              --rawfile value /tmp/doc-final.html --argjson version "$((version + 1))" \
              '{id: $id, status: "current", title: $title,
                body: {representation: "storage", value: $value},
                version: {number: $version, message: "Embedded images"}}')
            # The body goes as a file: a page of any size is one argv string
            # otherwise, and Linux caps a single argument at 128 KB.
            printf '%s' "$payload" > /tmp/payload.json
            code=$(curl --silent --show-error --output /tmp/doc-response.json \
                --write-out '%{http_code}' --request PUT \
                --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${pageId}" \
                --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                --header 'Accept: application/json' --header 'Content-Type: application/json' \
                --data @/tmp/payload.json)
            if [ "$code" != "200" ]; then
              echo "  failed to embed images: HTTP ${code}" >&2
              cat /tmp/doc-response.json >&2
              exit 1
            fi
            echo "  embedded ${diagrams} diagram(s) and ${images} image(s)"
          fi

          if [ "${RESTRICT}" == "true" ]; then
            accountId=$(curl --silent --show-error --fail \
                --url "${CONFLUENCE_BASE_URL}/wiki/rest/api/user/current" \
                --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                --header 'Accept: application/json' | jq -r '.accountId')
            restrictions=$(jq -n --arg id "$accountId" \
              '[{operation: "update",
                 restrictions: {user: [{type: "known", accountId: $id}], group: []}}]')
            rcode=$(curl --silent --show-error --output /tmp/doc-restrict.json \
                --write-out '%{http_code}' --request PUT \
                --url "${CONFLUENCE_BASE_URL}/wiki/rest/api/content/${pageId}/restriction" \
                --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                --header 'Accept: application/json' --header 'Content-Type: application/json' \
                --data "$restrictions")
            if [ "$rcode" != "200" ]; then
              echo "  failed to restrict editing: HTTP ${rcode}" >&2
              cat /tmp/doc-restrict.json >&2
              exit 1
            fi
            echo "  editing restricted; reading unchanged"
          fi
        done < /tmp/selected.txt

        if [ "${ARCHIVE_REMOVED}" == "true" ]; then
          # The children of the parent, read from the hierarchy rather than from
          # CQL. A CQL search on the label is one call instead of one per child,
          # but it answers from the search index: a page created minutes earlier
          # was repeatedly missing from its results, and a page missing here is
          # a page that never gets archived. The hierarchy is authoritative and
          # immediate.
          url="${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${DOCS_PARENT_ID}/children?limit=250"
          : > /tmp/children.txt
          searched=true
          while [ -n "$url" ]; do
            scode=$(curl --silent --show-error --output /tmp/children.json \
                --write-out '%{http_code}' --url "$url" \
                --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                --header 'Accept: application/json')
            if [ "$scode" != "200" ]; then
              echo "Could not list the children of ${DOCS_PARENT_ID}: HTTP ${scode}" >&2
              cat /tmp/children.json >&2
              searched=false
              break
            fi
            jq -r '.results[] | "\(.id)\t\(.title)"' /tmp/children.json >> /tmp/children.txt
            # The cursor link comes back rooted at the context path on some
            # instances and beneath it on others; strip it either way.
            nxt=$(jq -r '._links.next // ""' /tmp/children.json)
            [ -n "$nxt" ] && url="${CONFLUENCE_BASE_URL}/wiki${nxt#/wiki}" || url=""
          done

          # Of those, the ones this repository published. The label is what
          # separates them from a page written by hand under the same parent, or
          # published there by another repository.
          : > /tmp/existing.txt
          if [ "$searched" == "true" ]; then
            while IFS=$'\t' read -r id ctitle; do
              [ -n "$id" ] || continue
              labels=$(curl --silent --show-error \
                  --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${id}/labels?limit=250" \
                  --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                  --header 'Accept: application/json' | jq -r '.results[]?.name // empty')
              printf '%s\n' "$labels" | grep -Fxq "${DOCS_LABEL}" \
                && printf '%s\t%s\n' "$id" "$ctitle" >> /tmp/existing.txt
            done < /tmp/children.txt
          fi

          if [ "$searched" == "true" ]; then
            : > /tmp/to-archive.txt
            while IFS=$'\t' read -r id ptitle; do
              [ -n "$id" ] || continue
              grep -Fxq "$ptitle" /tmp/published.txt \
                || printf '%s\t%s\n' "$id" "$ptitle" >> /tmp/to-archive.txt
            done < /tmp/existing.txt

            if [ ! -s /tmp/to-archive.txt ]; then
              echo "Nothing to archive; every page labelled ${DOCS_LABEL} still has its document."
            else
              cut -f2 /tmp/to-archive.txt | sed 's/^/  no longer in the repository: /'

              # An archived page keeps its title and cannot be renamed
              # afterwards — nor revived — so the title is handed back now,
              # while the page is still current and the API still cooperates.
              # Write the document again later and it simply gets a new page.
              stamp="$(date -u +%Y-%m-%d) $(gh api "repos/${REPO}/commits/${SOURCE_REF}" --jq '.sha' | cut -c1-7)"
              while IFS=$'\t' read -r id ptitle; do
                [ -n "$id" ] || continue
                suffix=" [archived ${stamp}]"
                # Confluence stops at 255 characters. Trim the document's name
                # rather than the stamp, which is what keeps the title unique.
                keep=$((255 - ${#suffix}))
                newtitle="${ptitle:0:$keep}${suffix}"
                page=$(curl --silent --show-error \
                    --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${id}?body-format=storage" \
                    --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                    --header 'Accept: application/json')
                # The body goes back untouched: the document it was rendered
                # from is gone, so there is nothing left to rebuild it from, and
                # an update without a body would empty the page.
                payload=$(printf '%s' "$page" | jq --arg id "$id" --arg title "$newtitle" \
                  '{id: $id, status: "current", title: $title,
                    body: {representation: "storage", value: .body.storage.value},
                    version: {number: (.version.number + 1),
                              message: "Archived: the document is no longer in the repository"}}')
                # The body goes as a file: a page of any size is one argv string
                # otherwise, and Linux caps a single argument at 128 KB.
                printf '%s' "$payload" > /tmp/payload.json
                ncode=$(curl --silent --show-error --output /tmp/rename.json \
                    --write-out '%{http_code}' --request PUT \
                    --url "${CONFLUENCE_BASE_URL}/wiki/api/v2/pages/${id}" \
                    --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                    --header 'Accept: application/json' --header 'Content-Type: application/json' \
                    --data @/tmp/payload.json)
                if [ "$ncode" == "200" ]; then
                  echo "  renamed to '${newtitle}'"
                else
                  # Archive it anyway: a page left under its own name is the
                  # behaviour this replaced, not a new failure.
                  echo "  could not rename ${id}: HTTP ${ncode}" >&2
                  cat /tmp/rename.json >&2
                fi
              done < /tmp/to-archive.txt

              # The documented body carries the id as a number, so send one where
              # the id is numeric and fall back to the string it came as.
              payload=$(cut -f1 /tmp/to-archive.txt | jq -R '{id: (tonumber? // .)}' | jq -s '{pages: .}')
              # Archiving is v1 and asynchronous: it returns a task rather than
              # doing the work, and it is the one call here that needs the
              # space's Archive permission.
              # The body goes as a file: a page of any size is one argv string
              # otherwise, and Linux caps a single argument at 128 KB.
              printf '%s' "$payload" > /tmp/payload.json
              acode=$(curl --silent --show-error --output /tmp/archive.json \
                  --write-out '%{http_code}' --request POST \
                  --url "${CONFLUENCE_BASE_URL}/wiki/rest/api/content/archive" \
                  --user "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
                  --header 'Accept: application/json' --header 'Content-Type: application/json' \
                  --data @/tmp/payload.json)
              if [ "$acode" != "200" ] && [ "$acode" != "202" ]; then
                # A stale page is not worth failing a release over; say so and
                # leave the run green.
                echo "Could not archive them: HTTP ${acode}" >&2
                cat /tmp/archive.json >&2
              else
                echo "  archiving requested as task $(jq -r '.id // "?"' /tmp/archive.json)"
              fi
            fi
          fi
        fi
